<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Japanese girl with monocle, Eustace Tilley homage -->
  <rect width="64" height="64" rx="4" fill="#EDE8DF"/>
  <!-- Hair bun -->
  <circle cx="32" cy="16" r="8" fill="#2C2620" />
  <!-- Hair stick -->
  <line x1="26" y1="12" x2="38" y2="10" stroke="#8B6914" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Face -->
  <ellipse cx="32" cy="30" rx="10" ry="12" fill="none" stroke="#2C2620" stroke-width="1.8"/>
  <!-- Eye (left, looking) -->
  <ellipse cx="28" cy="28" rx="1.5" ry="1" fill="#2C2620"/>
  <!-- Monocle on right eye -->
  <circle cx="36" cy="28" r="4.5" fill="none" stroke="#2C2620" stroke-width="1.5"/>
  <!-- Monocle chain -->
  <path d="M40.5 28 Q46 34, 42 44" fill="none" stroke="#2C2620" stroke-width="0.8"/>
  <!-- Monocle eye -->
  <ellipse cx="36" cy="28" rx="1.5" ry="1" fill="#2C2620"/>
  <!-- Nose -->
  <path d="M32 30 L31 33" fill="none" stroke="#2C2620" stroke-width="1" stroke-linecap="round"/>
  <!-- Lips -->
  <path d="M29 36 Q32 38 35 36" fill="none" stroke="#2C2620" stroke-width="1" stroke-linecap="round"/>
  <!-- Neck -->
  <line x1="32" y1="42" x2="32" y2="48" stroke="#2C2620" stroke-width="1.5"/>
  <!-- Kimono collar V -->
  <path d="M24 52 L32 48 L40 52" fill="none" stroke="#2C2620" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Kimono body -->
  <path d="M20 64 L24 52 M40 52 L44 64" fill="none" stroke="#2C2620" stroke-width="1.5"/>
  <!-- Small butterfly she's looking at -->
  <g transform="translate(16,22) scale(0.6)">
    <path d="M0 0 Q-4 -5 -2 -8 Q0 -6 0 0" fill="none" stroke="#8B6914" stroke-width="1.2"/>
    <path d="M0 0 Q4 -5 2 -8 Q0 -6 0 0" fill="none" stroke="#8B6914" stroke-width="1.2"/>
    <path d="M0 0 Q-3 3 -1 6 Q0 4 0 0" fill="none" stroke="#8B6914" stroke-width="1"/>
    <path d="M0 0 Q3 3 1 6 Q0 4 0 0" fill="none" stroke="#8B6914" stroke-width="1"/>
  </g>
</svg>
