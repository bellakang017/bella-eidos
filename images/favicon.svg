<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#FAF6F1"/>

  <!-- === BUNNY (large, centered, professional) === -->

  <!-- Left ear -->
  <ellipse cx="22" cy="10" rx="5" ry="14" fill="#FFFFFF" stroke="#2C2620" stroke-width="1.8"/>
  <ellipse cx="22" cy="10" rx="2.2" ry="10" fill="#E8505B" opacity="0.5"/>

  <!-- Right ear -->
  <ellipse cx="42" cy="10" rx="5" ry="14" fill="#FFFFFF" stroke="#2C2620" stroke-width="1.8"/>
  <ellipse cx="42" cy="10" rx="2.2" ry="10" fill="#E8505B" opacity="0.5"/>

  <!-- Head -->
  <circle cx="32" cy="28" r="16" fill="#FFFFFF" stroke="#2C2620" stroke-width="1.8"/>

  <!-- Eyes — focused, studying look -->
  <circle cx="25" cy="26" r="2.8" fill="#2C2620"/>
  <circle cx="39" cy="26" r="2.8" fill="#2C2620"/>
  <!-- Eye shine -->
  <circle cx="26.2" cy="24.8" r="1" fill="#FFFFFF"/>
  <circle cx="40.2" cy="24.8" r="1" fill="#FFFFFF"/>

  <!-- Tiny glasses (professional look) -->
  <circle cx="25" cy="26" r="5" fill="none" stroke="#2C2620" stroke-width="1.2"/>
  <circle cx="39" cy="26" r="5" fill="none" stroke="#2C2620" stroke-width="1.2"/>
  <line x1="30" y1="25.5" x2="34" y2="25.5" stroke="#2C2620" stroke-width="1"/>
  <line x1="20" y1="25" x2="16" y2="23" stroke="#2C2620" stroke-width="0.8"/>
  <line x1="44" y1="25" x2="48" y2="23" stroke="#2C2620" stroke-width="0.8"/>

  <!-- Nose -->
  <ellipse cx="32" cy="31" rx="1.8" ry="1.3" fill="#E8505B"/>

  <!-- Mouth — slight determined smile -->
  <path d="M29 34 Q32 36.5 35 34" fill="none" stroke="#2C2620" stroke-width="1" stroke-linecap="round"/>
  <line x1="32" y1="32.3" x2="32" y2="34" stroke="#2C2620" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="22" cy="32" rx="3" ry="1.5" fill="#E8505B" opacity="0.25"/>
  <ellipse cx="42" cy="32" rx="3" ry="1.5" fill="#E8505B" opacity="0.25"/>

  <!-- === LAPTOP (below bunny) === -->
  <!-- Laptop screen -->
  <rect x="14" y="44" width="36" height="4" rx="1" fill="#B8DDE6" stroke="#2C2620" stroke-width="1"/>
  <!-- Code on screen -->
  <line x1="17" y1="46" x2="22" y2="46" stroke="#E8505B" stroke-width="0.8"/>
  <line x1="24" y1="46" x2="32" y2="46" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="34" y1="46" x2="38" y2="46" stroke="#2C2620" stroke-width="0.6"/>
  <!-- Laptop base -->
  <path d="M10 48 L14 48 L14 52 L50 52 L50 48 L54 48 L54 54 Q54 56 52 56 L12 56 Q10 56 10 54 Z" fill="#D4D0CC" stroke="#2C2620" stroke-width="1"/>
  <!-- Keyboard dots -->
  <rect x="18" y="49.5" width="28" height="2" rx="0.5" fill="#C0BCB6"/>

  <!-- === COFFEE MUG (tiny, right side) === -->
  <rect x="52" y="48" width="6" height="7" rx="2" fill="#FFFFFF" stroke="#8B6914" stroke-width="1"/>
  <path d="M58 50 Q60.5 51.5 58 53" fill="none" stroke="#8B6914" stroke-width="0.8"/>
  <!-- Coffee inside -->
  <rect x="53" y="50.5" width="4" height="3" rx="1" fill="#C4956A" opacity="0.6"/>
  <!-- Steam -->
  <path d="M54 46 Q55 44 54 42" fill="none" stroke="#C4956A" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
  <path d="M56 47 Q57 45 56 43" fill="none" stroke="#C4956A" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>

  <!-- === SMALL HEART (top right corner accent) === -->
  <path d="M56 6 Q56 3 53.5 3 Q51 3 51 6 Q51 3 48.5 3 Q46 3 46 6 Q46 9 51 13 Q56 9 56 6Z" fill="#E8505B" opacity="0.35" stroke="none"/>
</svg>
