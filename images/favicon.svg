<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="6" fill="#F5F0E8"/>
  <!-- Desk surface -->
  <rect x="4" y="42" width="56" height="18" rx="2" fill="#E8DFD0" stroke="#2C2620" stroke-width="0.8"/>
  <!-- Chair back -->
  <rect x="8" y="14" width="18" height="30" rx="3" fill="#D4796A" stroke="#2C2620" stroke-width="1"/>
  <!-- Monitor -->
  <rect x="38" y="12" width="18" height="22" rx="2" fill="#2C2620"/>
  <!-- Monitor screen -->
  <rect x="40" y="14" width="14" height="16" rx="1" fill="#3A3530"/>
  <!-- Screen dots -->
  <circle cx="44" cy="19" r="1" fill="#888"/>
  <circle cx="48" cy="19" r="1" fill="#888"/>
  <circle cx="44" cy="23" r="1" fill="#666"/>
  <circle cx="48" cy="23" r="0.8" fill="#666"/>
  <!-- Monitor stand -->
  <rect x="44" y="34" width="6" height="4" rx="1" fill="#2C2620"/>
  <rect x="42" y="37" width="10" height="2" rx="1" fill="#2C2620"/>
  <!-- Keyboard -->
  <rect x="22" y="44" width="18" height="6" rx="1.5" fill="#F8F5F0" stroke="#2C2620" stroke-width="0.8"/>
  <!-- Keyboard lines -->
  <line x1="24" y1="46" x2="38" y2="46" stroke="#CCC" stroke-width="0.5"/>
  <line x1="24" y1="48" x2="38" y2="48" stroke="#CCC" stroke-width="0.5"/>
  <!-- Bunny body -->
  <ellipse cx="22" cy="36" rx="10" ry="8" fill="#FFFFFF" stroke="#2C2620" stroke-width="1.5"/>
  <!-- Bunny head -->
  <circle cx="22" cy="26" r="7" fill="#FFFFFF" stroke="#2C2620" stroke-width="1.5"/>
  <!-- Left ear -->
  <ellipse cx="17" cy="12" rx="3" ry="10" fill="#FFFFFF" stroke="#2C2620" stroke-width="1.5"/>
  <ellipse cx="17" cy="12" rx="1.2" ry="7" fill="#F0DBD5"/>
  <!-- Right ear -->
  <ellipse cx="27" cy="12" rx="3" ry="10" fill="#FFFFFF" stroke="#2C2620" stroke-width="1.5"/>
  <ellipse cx="27" cy="12" rx="1.2" ry="7" fill="#F0DBD5"/>
  <!-- Eyes -->
  <circle cx="19" cy="25" r="1.2" fill="#2C2620"/>
  <circle cx="25" cy="25" r="1.2" fill="#2C2620"/>
  <!-- Nose -->
  <ellipse cx="22" cy="28" rx="1" ry="0.7" fill="#D4796A"/>
  <!-- Mouth -->
  <path d="M20.5 29.5 Q22 31 23.5 29.5" fill="none" stroke="#2C2620" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="17" cy="28" rx="2" ry="1" fill="#F0DBD5" opacity="0.7"/>
  <ellipse cx="27" cy="28" rx="2" ry="1" fill="#F0DBD5" opacity="0.7"/>
  <!-- Paws on keyboard -->
  <ellipse cx="28" cy="43" rx="3.5" ry="2" fill="#FFFFFF" stroke="#2C2620" stroke-width="1"/>
  <ellipse cx="22" cy="44" rx="3" ry="1.8" fill="#FFFFFF" stroke="#2C2620" stroke-width="1"/>
  <!-- Coffee mug -->
  <rect x="48" y="44" width="7" height="8" rx="2" fill="#FFFFFF" stroke="#2C2620" stroke-width="1"/>
  <path d="M55 46 Q58 47.5 55 49" fill="none" stroke="#2C2620" stroke-width="0.8"/>
  <!-- Steam -->
  <path d="M50 42 Q51 40 50 38" fill="none" stroke="#AAA" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M53 43 Q54 41 53 39" fill="none" stroke="#AAA" stroke-width="0.6" stroke-linecap="round"/>
  <!-- Phone on desk -->
  <rect x="6" y="46" width="6" height="9" rx="1" fill="#2C2620"/>
  <rect x="7" y="47.5" width="4" height="6" rx="0.5" fill="#3A3530"/>
</svg>
